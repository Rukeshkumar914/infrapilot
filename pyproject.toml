[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infrapilot"
version = "0.1.0"
description = "Linux system monitoring and automation platform"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9"
]

[tool.setuptools.packages.find]
where = ["src"]
